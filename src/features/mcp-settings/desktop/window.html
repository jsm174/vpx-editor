<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>MCP Server Settings</title>
    <script>
      var theme = new URLSearchParams(window.location.search).get('theme');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
    </script>
    <link rel="stylesheet" href="../../../shared/window-base.css" />
    <link rel="stylesheet" href="../../settings/shared/component.css" />
    <link rel="stylesheet" href="window.css" />
  </head>
  <body>
    <div class="settings-container">
      <div class="settings-body">
        <div class="settings-section">
          <div class="settings-section-title">Server</div>
          <div class="settings-checkbox-row">
            <input type="checkbox" id="mcp-enabled" />
            <label for="mcp-enabled">Enable MCP server when the editor is running</label>
          </div>
          <div class="settings-field-row">
            <label>Port</label>
            <input type="number" id="mcp-port" class="win-input settings-number-input" min="1024" max="65535" />
          </div>
          <div class="settings-field-row mcp-status-row">
            <span class="mcp-status-label">Status:</span>
            <span id="mcp-status-text" class="mcp-status-text">—</span>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-title">Connect Claude Code</div>
          <div class="mcp-info-row">
            <span class="mcp-info-text">Run this in your terminal once, then restart Claude Code:</span>
          </div>
          <div class="settings-field-row">
            <input type="text" id="mcp-claude-cmd" class="win-input" readonly />
            <button class="win-btn" id="mcp-copy-cmd">Copy</button>
            <button class="win-btn" id="mcp-regenerate" title="Generate a new access token and restart the server">Regenerate token</button>
          </div>
          <div id="mcp-copy-feedback" class="mcp-info-text"></div>
        </div>
      </div>

      <div class="settings-footer">
        <button class="win-btn" id="mcp-cancel">Cancel</button>
        <button class="win-btn primary" id="mcp-ok">OK</button>
      </div>
    </div>

    <script type="module" src="./window.ts"></script>
  </body>
</html>
